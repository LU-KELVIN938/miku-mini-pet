<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miku Mini · Codex 原生步态预览</title>
<style>body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#ecf6f3;color:#284d56;margin:0;padding:30px}main{max-width:760px;margin:auto}h1{font-size:25px}p{font-size:14px;line-height:1.7}select,button{padding:8px;border-radius:8px;border:1px solid #bad7d1;background:white;color:#284d56}.compare{display:flex;gap:30px;margin:25px 0}.card{background:#fff;border:1px solid #c9e1da;border-radius:18px;padding:15px;text-align:center;flex:1}.pet{width:192px;height:208px;margin:15px auto;background-size:800% 1100%;background-repeat:no-repeat}small{color:#597d82}@media(max-width:500px){body{padding:15px}.compare{gap:10px}.card{padding:5px}.pet{width:144px;height:156px}}</style>
<main><h1>Miku Mini · 左右脚交替步态</h1><p>复用原画补齐换脚姿势。向左、向右移动各有八个姿势，保留原来的角色样子。</p>
<label>动作 <select id="state"><option value="idle">待机</option><option value="running">工作中</option><option value="waiting">等你回应</option><option value="review">审阅</option><option value="running-right">向右移动</option><option value="running-left">向左移动</option><option value="waving">挥手</option><option value="jumping">跳跃</option><option value="failed">失落</option></select></label>
<label><input type="checkbox" id="loop">循环观察</label><button id="stop">停止 / 待机</button>
<div class="compare"><div class="card">原素材<div class="pet" id="original"></div></div><div class="card">新版 Codex 素材<div class="pet" id="native"></div></div></div>
<small>按本机 Codex 的动作间隔播放。默认移动三遍后转待机；停止和反向可能打断当前一步。此页面用于素材预览，真实 Codex 内仍需确认效果。</small></main>
<script type="module">
import {makeTimeline} from './native-timeline.js';
const old=document.querySelector('#original'),pet=document.querySelector('#native');
old.style.backgroundImage="url('source-spritesheet.webp')";
const bytes=new Uint8Array(await(await fetch('native-spritesheet.webp')).arrayBuffer());
let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));
const url='data:image/webp;base64,'+btoa(binary),image=new Image();image.src=url;await image.decode();pet.style.backgroundImage='url("'+url+'")';
let state='idle';
const timeline=makeTimeline({manual:new URLSearchParams(location.search).has('manual'),paint(frame){for(const el of [old,pet]){el.style.backgroundPosition=`${frame.column/7*100}% ${frame.row/10*100}%`;el.dataset.row=frame.row;el.dataset.column=frame.column;}}});
function setState(s,opts={}){state=s;timeline.setState(s,{loop:document.querySelector('#loop').checked,...opts});}
document.querySelector('#state').onchange=e=>setState(e.target.value);
document.querySelector('#loop').onchange=()=>setState(state);
document.querySelector('#stop').onclick=()=>{document.querySelector('#state').value='idle';setState('idle');};
window.NativePet={setState,advance:timeline.advance,getFrame:timeline.getFrame,setLookFrame(row,column){setState('idle',{lookFrame:{row,column}});},ready:true};setState('idle');
</script></html>
