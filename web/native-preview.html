<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miku Mini · Codex 内置素材预览</title>
<style>body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#ecf6f3;color:#284d56;margin:0;padding:30px}main{max-width:700px;margin:auto}h1{font-size:25px}p{font-size:14px;line-height:1.7}select{padding:8px;border-radius:8px;border:1px solid #bad7d1}.compare{display:flex;gap:30px;margin:25px 0}.card{background:#fff;border:1px solid #c9e1da;border-radius:18px;padding:15px;text-align:center;flex:1}.pet{width:192px;height:208px;margin:15px auto;background-size:800% 1100%;background-repeat:no-repeat}small{color:#597d82}@media(max-width:500px){body{padding:15px}.compare{gap:10px}.card{padding:5px}.pet{width:144px;height:156px}}</style>
<main><h1>直接装进 Codex 的未来喵</h1><p>右侧显示这次真正安装的宠物素材。呼吸、眨眼和精选过渡已保存在图集里。</p>
<label>动作 <select id="state"><option value="idle">待机</option><option value="running">工作中</option><option value="waiting">等你回应</option><option value="review">审阅</option><option value="running-right">向右移动</option><option value="running-left">向左移动</option><option value="waving">挥手</option><option value="jumping">跳跃</option><option value="failed">失落</option></select></label>
<div class="compare"><div class="card">原素材<div class="pet" id="original"></div></div><div class="card">新版 Codex 素材<div class="pet" id="native"></div></div></div>
<small>预览按 Codex 的固定格子与播放间隔显示；新素材自身包含连续画面。16 个注视方向保留原图。</small></main>
<script>
(async()=>{
const config=await(await fetch('animations.json')).json(),rows=new Map(config.states.map(r=>[r.state,r]));
const old=document.querySelector('#original'),pet=document.querySelector('#native');
old.style.backgroundImage="url('source-spritesheet.webp')";
// Codex's local loader also supplies custom sprites as an image/webp data URL.
const bytes=new Uint8Array(await(await fetch('native-spritesheet.webp')).arrayBuffer());
let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));
const url='data:image/webp;base64,'+btoa(binary),image=new Image();image.src=url;await image.decode();
pet.style.backgroundImage='url("'+url+'")';
let state='idle',timer;
function setState(s){state=s;clearTimeout(timer);let i=0;const row=rows.get(s);
 function draw(){const position=`${i/7*100}% ${row.row/10*100}%`;old.style.backgroundPosition=pet.style.backgroundPosition=position;
  timer=setTimeout(()=>{i=(i+1)%row.count;draw()},row.durations[i]*(state==='idle'?6:1));}draw();
}
document.querySelector('#state').addEventListener('change',e=>setState(e.target.value));
window.NativePet={setState,setLookFrame(row,col){clearTimeout(timer);old.style.backgroundPosition=pet.style.backgroundPosition=`${col/7*100}% ${row/10*100}%`;},ready:true};setState('idle');
})().catch(e=>{document.querySelector('small').textContent='加载失败：'+e.message;console.error(e)});
</script></html>
